<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>TurboToad.net</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/index.css" />
    <script type="module">
        import { loadPosts } from './js/blog.js';
        import { renderLatestNews } from './js/blog-home.js';
        import { loadCollections, renderCollectionsGrid } from './js/collections.js';
        import { initHeroRotation } from './js/hero.js';
        import './js/search.js';
        
        async function init() {
            await loadPosts();
            await loadCollections();
            initHeroRotation();
            renderLatestNews();
            renderCollectionsGrid(document.getElementById('collections-container'));
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</head>

<body>
    <div class="announcement-bar" role="status" aria-live="polite">
        This website is under construction.
    </div>
    <header class="site-header">
        <div class="topbar container">
            <div class="logo"><a href="/">TurboToad.net</a></div>
            <div class="top-actions">
                <input class="search" placeholder="Search" aria-label="Search site">
            </div>
        </div>
        <nav class="main-nav">
            <div class="container">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="blog.html?post=welcome-to-turbotoad-net">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="site-main container">
        <section class="hero" title="Click to view full gallery">
            <!-- Photo from collections rotates here -->
        </section>

        <div class="content-row">
            <section class="featured" id="collections-container">
                <!-- Photo collections render here -->
            </section>

            <aside class="sidebar" id="sidebar-content">
                <!-- Blog posts will render here -->
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-links">Github: turbotoad12</div>
            <div class="copyright">© 2026 TurboToad.net. All Rights Reserved.</div>
        </div>
    </footer>
</body>

</html>
