<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Blog - TurboToad.net</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Blog posts from TurboToad.net" />
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/index.css" />
    <script type="module">
        import { loadPosts } from './js/blog.js';
        import { renderBlogListing, renderBlogPost } from './js/blog-page.js';
        import './js/search.js';
        
        async function init() {
            await loadPosts();
            
            // Check if viewing a specific post
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('post');
            const container = document.getElementById('blog-container');
            
            if (postId) {
                renderBlogPost(container, postId);
            } else {
                renderBlogListing(container);
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</head>

<body>
    <header class="site-header">
        <div class="topbar container">
            <div class="logo"><a href="/">TurboToad.net</a></div>
            <div class="top-actions">
                <input class="search" placeholder="Search" aria-label="Search site">
            </div>
        </div>
        <nav class="main-nav">
            <div class="container">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="blog.html?post=welcome-to-turbotoad-net">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="site-main container" id="blog-container">
        <!-- Blog content renders here via JavaScript -->
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-links">Github: turbotoad12</div>
            <div class="copyright">© 2026 Turbotoad. All Rights Reserved.</div>
        </div>
    </footer>
</body>

</html>
