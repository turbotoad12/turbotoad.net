<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Gallery - TurboToad.net</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Photo gallery" />
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/index.css" />
    <script type="module">
        import { loadCollections, getCollections } from './js/collections.js';
        import { renderCollectionGallery } from './js/gallery.js';
        
        async function init() {
            await loadCollections();
            
            // Get collection ID from URL
            const params = new URLSearchParams(window.location.search);
            const collectionId = params.get('collection');
            
            const collections = getCollections();
            const collection = collections.find(c => c.id === collectionId);
            
            if (!collection) {
                document.getElementById('gallery-container').innerHTML = '<p>Collection not found.</p>';
                return;
            }
            
            renderCollectionGallery(document.getElementById('gallery-container'), collection);
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</head>

<body>
    <header class="site-header">
        <div class="topbar container">
            <div class="logo"><a href="/">TurboToad.net</a></div>
            <div class="top-actions">
                <input class="search" placeholder="Search" aria-label="Search site">
            </div>
        </div>
        <nav class="main-nav">
            <div class="container">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="blog.html?post=welcome-to-turbotoad-net">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="site-main container" id="gallery-container">
        <!-- Gallery renders here -->
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-links">Careers | Contact Us | Terms of Use</div>
            <div class="copyright">© 2026 Turbotoad. All Rights Reserved.</div>
        </div>
    </footer>
</body>

</html>
